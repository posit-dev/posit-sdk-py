name: CI
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install
      - run: make dev
      - run: make lint
      - run: make fmt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: make dev
      - run: make test

  setup-integration-test:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
        - uses: actions/checkout@v7
        - id: versions
          working-directory: ./integration
          # The `jq` command is "output compact, raw input, slurp, split on new lines, and remove the last element". This results in a JSON array of Connect versions (e.g., ["2025.01.0", "2024.12.0"]).
          run: |
            versions=$(make print-versions | jq -c -Rs 'split("\n") | .[:-1]')
            echo "versions=$versions" >> "$GITHUB_OUTPUT"

  integration-test:
    runs-on: ubuntu-latest
    needs: setup-integration-test
    strategy:
      fail-fast: false
      matrix:
        CONNECT_VERSION: ${{ fromJson(needs.setup-integration-test.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install
      - name: Write Connect license file
        env:
          CONNECT_LICENSE: ${{ secrets.CONNECT_LICENSE }}
        run: |
          umask 077
          printf '%s' "$CONNECT_LICENSE" > integration/license.lic
      - name: Run integration tests
        run: make -C ./integration test-${{ matrix.CONNECT_VERSION }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.CONNECT_VERSION }} - Integration Test Report
          path: integration/reports/*.xml

  setup-workbench-integration-test:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
        - uses: actions/checkout@v4
        - id: versions
          working-directory: ./integration
          run: |
            versions=$(make print-workbench-versions | jq -c -Rs 'split("\n") | .[:-1]')
            echo "versions=$versions" >> "$GITHUB_OUTPUT"

  workbench-integration-test:
    runs-on: ubuntu-latest
    needs: setup-workbench-integration-test
    strategy:
      fail-fast: false
      matrix:
        WORKBENCH_VERSION: ${{ fromJson(needs.setup-workbench-integration-test.outputs.versions) }}
    env:
      # Secrets can't be used in `if:` directly; skip (rather than fail) until the secret exists,
      # e.g. on pull requests from forks.
      HAS_WORKBENCH_LICENSE: ${{ secrets.WORKBENCH_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_WORKBENCH_LICENSE == 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.HAS_WORKBENCH_LICENSE == 'true'
      - run: uv python install
        if: env.HAS_WORKBENCH_LICENSE == 'true'
      # with-workbench runs `command` inside the Workbench container, so start it without one
      # and run the tests on the runner against its outputs.
      - name: Start Workbench
        id: workbench
        if: env.HAS_WORKBENCH_LICENSE == 'true'
        # Fork with --api-token support until it lands upstream in posit-dev/with-workbench.
        uses: michaelmayer2/with-workbench@sdk-integration
        with:
          version: ${{ matrix.WORKBENCH_VERSION }}
          license-key: ${{ secrets.WORKBENCH_LICENSE }}
          api-token: admin
          quiet: 'true'
      - name: Run integration tests
        if: env.HAS_WORKBENCH_LICENSE == 'true'
        env:
          WORKBENCH_SERVER: ${{ steps.workbench.outputs.WORKBENCH_URL }}
          WORKBENCH_API_KEY: ${{ steps.workbench.outputs.WORKBENCH_API_KEY }}
          WORKBENCH_USER: ${{ steps.workbench.outputs.WORKBENCH_USER }}
        run: make -C ./integration workbench-test-${{ matrix.WORKBENCH_VERSION }}
      - name: Stop Workbench
        # Also deactivates the license; always run so activations don't leak.
        if: always() && steps.workbench.outputs.CONTAINER_ID != ''
        uses: michaelmayer2/with-workbench@sdk-integration
        with:
          license-key: ${{ secrets.WORKBENCH_LICENSE }}
          stop: ${{ steps.workbench.outputs.CONTAINER_ID }}
      - uses: actions/upload-artifact@v5
        if: always() && env.HAS_WORKBENCH_LICENSE == 'true'
        with:
          name: Workbench ${{ matrix.WORKBENCH_VERSION }} - Integration Test Report
          path: integration/reports/*.xml

  integration-test-report:
    needs: [integration-test, workbench-integration-test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: integration-test-results
          comment_mode: off
          files: "artifacts/**/*.xml"
          report_individual_runs: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install
      - run: make dev
      - run: make build
